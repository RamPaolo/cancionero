<style id="app-css">
@font-face{font-family:'Balsamiq Sans';font-style:normal;font-weight:400;font-display:swap;src:url('balsamiq-sans-400.woff2') format('woff2')}
@font-face{font-family:'Balsamiq Sans';font-style:normal;font-weight:700;font-display:swap;src:url('balsamiq-sans-700.woff2') format('woff2')}
@font-face{font-family:'Balsamiq Sans';font-style:italic;font-weight:700;font-display:swap;src:url('balsamiq-sans-700i.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('barlow-condensed-700.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url('barlow-400.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url('barlow-600.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url('barlow-700.woff2') format('woff2')}
:root {
  --paper: #ffffff; --wash: #fff2f5; --wash-2: #fbe4ea; --ink: #1e2447; --muted: #62688a; --rule: #f0cfd9;
  --chord: #c8102e; --chord-hl: #ffe3e8; --label: #c4520f; --note: #b81e57; --accent: #3a43c4; --accent-ink: #ffffff;
  --shadow: 0 10px 32px rgba(30, 36, 71, .18); --focus: #3a43c4;
  --lyric-font: 'Balsamiq Sans', 'Comic Neue', 'Trebuchet MS', system-ui, sans-serif;
  --chord-font: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --ui-font: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --fs: 20px; --align: center;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10142a; --wash: #181d3a; --wash-2: #232a52; --ink: #f4f5fb; --muted: #a9aecb; --rule: #2c3360;
    --chord: #ffc23d; --chord-hl: #3a3313; --label: #ff9a4d; --note: #ff84ac; --accent: #9aa3ff; --accent-ink: #10142a;
    --shadow: 0 10px 32px rgba(0, 0, 0, .5); --focus: #ffc23d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10142a; --wash: #181d3a; --wash-2: #232a52; --ink: #f4f5fb; --muted: #a9aecb; --rule: #2c3360;
  --chord: #ffc23d; --chord-hl: #3a3313; --label: #ff9a4d; --note: #ff84ac; --accent: #9aa3ff; --accent-ink: #10142a;
  --shadow: 0 10px 32px rgba(0, 0, 0, .5); --focus: #ffc23d; color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--ui-font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Inicio ---------- */
.home { max-width: 44rem; margin: 0 auto; padding: 0 0 5rem; }
.hero { padding: 1.4rem 1.1rem .6rem; display: flex; align-items: flex-start; gap: .8rem; background: var(--wash); border-bottom: 3px dotted var(--rule); }
.hero h1 { margin: 0; font: 700 2.15rem/1 var(--lyric-font); letter-spacing: -.01em; }
.hero p { margin: .35rem 0 0; color: var(--muted); font-size: 1rem; font-weight: 600; }
.hero p small { display: block; font-weight: 500; font-size: .86rem; }
.bookbtn { display: inline-flex; align-items: center; gap: .25rem; margin: .45rem 0 0 -.1rem; padding: .2rem .1rem; min-height: 36px; border: 0; background: transparent;
  color: var(--ink); font: 700 1.02rem/1.2 var(--ui-font); text-align: left; border-radius: 8px; }
.bookbtn svg.i { width: 18px; height: 18px; color: var(--muted); }
.bookbtn:hover { background: var(--wash-2); }
.hero p.sub { margin: .05rem 0 0; font-weight: 500; font-size: .86rem; }
.empty .btn { margin-top: .3rem; }
.steps { margin: .3rem 0 1rem; padding-left: 1.3rem; display: grid; gap: .9rem; }
.steps li { padding-left: .2rem; }
.steps li .btnrow { margin-top: .45rem; }
.note-box { background: var(--wash); border-radius: 12px; padding: .7rem .9rem; font-size: .92rem; color: var(--muted); margin: .6rem 0; }
.note-box b { color: var(--ink); }
.booklist { list-style: none; margin: 0 0 .7rem; padding: 0; }
.bookrow { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--rule); }
.bookrow .ttl { flex: 1; min-width: 0; font: 700 1.02rem/1.25 var(--lyric-font); }
.bookrow .ttl small { display: block; font: 500 .82rem var(--ui-font); color: var(--muted); }
.bookrow .on { color: var(--chord); font: 700 .85rem var(--ui-font); }
.hero .grow { flex: 1; min-width: 0; }
.hero-actions { display: flex; gap: .4rem; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 .55rem; gap: .35rem;
  border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-weight: 600; }
.iconbtn:hover { background: var(--wash-2); }
.iconbtn.solid { background: var(--accent); color: var(--accent-ink); }
.searchbar { position: sticky; top: 0; z-index: 5; padding: .7rem 1rem .5rem; background: var(--paper); top: env(safe-area-inset-top, 0px); }
.search { display: flex; align-items: center; gap: .5rem; padding: 0 .8rem; height: 48px; border-radius: 14px; background: var(--wash); border: 1.5px solid var(--rule); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 1.05rem; outline: none; height: 100%; }
.search:focus-within { border-color: var(--accent); }
.tabs { display: flex; gap: .45rem; overflow-x: auto; padding: .6rem 1rem .2rem; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: .45rem; height: 36px; padding: 0 .8rem; border-radius: 10px 10px 4px 4px;
  border: 1.5px solid var(--rule); background: var(--paper); font-weight: 600; font-size: .92rem; white-space: nowrap; }
.tab .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--g, var(--muted)); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.grp-h { display: flex; align-items: center; gap: .6rem; margin: 1.4rem 1rem .3rem; font: 700 1.05rem/1.2 var(--lyric-font); }
.grp-h .bt { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 .3rem; border-radius: 8px 8px 3px 3px;
  background: var(--g); color: #fff; font: 700 1.12rem/1 var(--chord-font); }
.grp-h small { color: var(--muted); font: 500 .85rem var(--ui-font); margin-left: auto; }
.list { list-style: none; margin: 0; padding: 0 .5rem; }
.row { display: flex; align-items: center; gap: .7rem; padding: .62rem .6rem .62rem .75rem; text-decoration: none; color: inherit; border-radius: 12px;
  border-left: 5px solid var(--g, var(--rule)); margin: .12rem 0; }
.row:hover { background: var(--wash); }
.row .num { width: 2.1rem; flex: none; text-align: right; font: 700 1.15rem/1 var(--chord-font); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .txt { flex: 1; min-width: 0; }
.row .ttl { display: block; font: 700 1.08rem/1.25 var(--lyric-font); }
.row .sub { display: block; color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1rem; }
.row .sub:empty { display: none; }
.row .sub mark { background: var(--chord-hl); color: inherit; border-radius: 3px; }
.key { flex: none; min-width: 2.6rem; text-align: center; padding: .28rem .45rem; border-radius: 8px; font: 700 1.05rem/1 var(--chord-font);
  color: var(--chord); background: var(--wash); }
.pill { display: inline-block; padding: .05rem .45rem; border-radius: 6px; background: var(--wash-2); color: var(--ink); font-size: .78rem; font-weight: 600; margin-right: .3rem; }
.empty { text-align: center; color: var(--muted); padding: 2.5rem 1.2rem; }
.foot { margin: 2.2rem 1rem 0; padding-top: 1rem; border-top: 3px dotted var(--rule); color: var(--muted); font-size: .9rem; display: grid; gap: .7rem; }
.banner { margin: .8rem 1rem 0; padding: .8rem .9rem; border-radius: 14px; background: var(--wash-2); display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1 1 14rem; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: 0 1rem; border-radius: 12px;
  border: 1.5px solid var(--rule); background: var(--paper); font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: #b3261e; border-color: #f1b8b4; }
.btn[disabled] { opacity: .45; cursor: default; }
.btnrow { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ---------- Canción ---------- */
.ctrl { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: .25rem; padding: .35rem .4rem;
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--rule); }
.ctrl > * { flex-shrink: 0; }
.ctrl .spacer { flex: 1 1 0; min-width: 0; flex-shrink: 1; }
.ctrl .iconbtn { min-width: 40px; padding: 0 .25rem; }
.keygroup { display: flex; align-items: stretch; border-radius: 14px; background: var(--wash); border: 1.5px solid var(--rule); overflow: hidden; }
.keygroup button { border: 0; background: transparent; min-width: 40px; height: 46px; display: grid; place-items: center; }
.keygroup button:hover { background: var(--wash-2); }
.keybtn { min-width: 64px !important; padding: 0 .35rem; border-left: 1.5px solid var(--rule) !important; border-right: 1.5px solid var(--rule) !important; line-height: 1; }
.keybtn .k { font: 700 1.55rem/1 var(--chord-font); color: var(--chord); }
.keybtn .d { display: block; font: 600 .7rem/1 var(--ui-font); color: var(--muted); margin-top: 2px; }
.capobtn { height: 46px; min-width: 52px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--paper); line-height: 1.05; font-size: .72rem; font-weight: 600; color: var(--muted); }
.capobtn b { display: block; font: 700 1.2rem/1 var(--chord-font); color: var(--ink); }
.capobtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.capobtn.on b { color: var(--paper); }
.play.on { background: var(--chord); color: var(--paper); }
.song-wrap { max-width: 46rem; margin: 0 auto; padding: 0 .9rem 7rem; overflow-x: clip; }
.song-h { text-align: var(--align); padding: 1.2rem 0 .4rem; }
.song-h .bt { display: inline-grid; place-items: center; min-width: 36px; height: 34px; padding: 0 .45rem; border-radius: 9px 9px 3px 3px; background: var(--g); color: #fff;
  font: 700 1.2rem/1 var(--chord-font); margin-bottom: .45rem; }
.song-h h1 { margin: 0; font: 700 1.6rem/1.15 var(--lyric-font); }
.song-h .meta { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
.song-h .keyline { margin: .5rem 0 0; font-size: .92rem; color: var(--muted); }
.song-h .keyline b { font-family: var(--chord-font); font-size: 1.15em; color: var(--chord); }
.song-h .style { margin: .45rem auto 0; font: italic 600 .95rem/1.35 var(--lyric-font); color: var(--label); max-width: 34rem; }
.song { font-size: var(--fs); text-align: var(--align); padding-top: .4rem; }
.ln { margin: 0; font-family: var(--lyric-font); line-height: 1.5; }
.ln.hc { line-height: 2.75; }
.w { white-space: nowrap; }
.a { display: inline-block; position: relative; width: 0; height: 0; vertical-align: baseline; }
.ch { position: absolute; left: -.06em; bottom: 1.2em; font: 700 .86em/1 var(--chord-font); color: var(--chord); white-space: nowrap; letter-spacing: .01em;
  padding: .06em .08em; border-radius: .25em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ch:hover { background: var(--chord-hl); }
.ch.x { color: var(--muted); font-weight: 600; cursor: default; }
.ch.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: var(--chord-hl); } to { background: transparent; } }
.lbl { display: flex; align-items: center; gap: .6em; margin: 1.35em 0 .1em; font: 700 .7em/1.2 var(--lyric-font); color: var(--label); letter-spacing: .02em; }
.lbl::before, .lbl::after { content: ''; flex: 1; border-top: 2px dotted currentColor; opacity: .55; }
.note { margin: .45em 0; font: italic 700 .8em/1.4 var(--lyric-font); color: var(--note); }
.instr { margin: .35em 0; font: 600 .78em/1.6 var(--ui-font); color: var(--muted); }
.instr .ci { font: 700 1.15em var(--chord-font); color: var(--chord); cursor: pointer; padding: 0 .08em; border-radius: .2em; }
.instr .ci:hover { background: var(--chord-hl); }
.gap { height: .95em; }
.nochords .a, .nochords .instr { display: none; }
.nochords .ln.hc { line-height: 1.5; }
.song-f { margin: 2.2rem 0 0; padding-top: 1rem; border-top: 3px dotted var(--rule); color: var(--muted); font-size: .92rem; display: grid; gap: .5rem; text-align: left; }
.song-f a { overflow-wrap: anywhere; }
.setbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; align-items: center; gap: .4rem; padding: .45rem .5rem;
  padding-bottom: calc(.45rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); }
.setbar button { flex: 1; min-width: 0; min-height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: inherit; display: flex; align-items: center; gap: .3rem; padding: 0 .6rem; }
.setbar button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.setbar button.next { justify-content: flex-end; text-align: right; }
.setbar .pos { flex: none; font: 700 1rem var(--chord-font); padding: 0 .3rem; }
.setbar button[disabled] { opacity: .35; }

/* ---------- Hojas (paneles inferiores) ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 35; background: rgba(16, 20, 42, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 40rem; max-height: 88vh; max-height: 88dvh; overflow: auto; background: var(--paper); color: var(--ink);
  border-radius: 22px 22px 0 0; box-shadow: var(--shadow); padding: .6rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom, 0px)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto .6rem; }
.sheet-h { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; }
.sheet-h h2 { flex: 1; margin: 0; font: 700 1.25rem/1.2 var(--lyric-font); }
.sheet p.help { color: var(--muted); margin: .2rem 0 .8rem; font-size: .93rem; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45rem; margin: .4rem 0 .9rem; }
.keys button { min-height: 58px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--paper); display: grid; place-items: center; line-height: 1.05; }
.keys button b { font: 700 1.45rem/1 var(--chord-font); color: var(--chord); }
.keys button small { color: var(--muted); font-size: .75rem; }
.keys button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.keys button[aria-pressed="true"] b, .keys button[aria-pressed="true"] small { color: var(--paper); }
.keys button.orig { border-style: dashed; border-color: var(--chord); }
.capos { grid-template-columns: repeat(5, 1fr); }
.menu { list-style: none; margin: 0; padding: 0; }
.menu button, .menu a { width: 100%; display: flex; align-items: center; gap: .8rem; min-height: 52px; padding: 0 .4rem; border: 0; background: transparent; text-align: left;
  border-radius: 10px; font-size: 1.02rem; color: var(--ink); text-decoration: none; }
.menu button:hover, .menu a:hover { background: var(--wash); }
.menu .sub { margin-left: auto; color: var(--muted); font-size: .88rem; }
.seg { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: transparent; min-height: 42px; padding: 0 .85rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.setting > span { font-weight: 600; }
.chordbig { text-align: center; font: 700 3rem/1 var(--chord-font); color: var(--chord); margin: .2rem 0 .1rem; }
.chordnotes { text-align: center; color: var(--muted); margin: 0 0 .7rem; font-size: 1rem; }
.chordnotes b { color: var(--ink); }
.piano { width: 100%; height: auto; display: block; margin: .3rem 0 .6rem; }
.piano .wk { fill: #fff; stroke: #9aa0bb; stroke-width: 1; }
.piano .bk { fill: #23283f; }
.piano .rh { fill: #c8102e; }
.piano .lh { fill: #3a43c4; }
.piano text { font: 700 12px var(--ui-font); text-anchor: middle; }
.piano .lbl-w { fill: #fff; }
.chordnav { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: .4rem; }
.chordnav .btn { padding: 0 .35rem; gap: .25rem; }
.legend { display: flex; justify-content: center; gap: 1rem; color: var(--muted); font-size: .88rem; margin-bottom: .7rem; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: .3rem; }
.metro { display: flex; align-items: center; justify-content: center; gap: .6rem; margin: .4rem 0 1rem; }
.metro output { font: 700 3rem/1 var(--chord-font); min-width: 5.5rem; text-align: center; }
.beats { display: flex; justify-content: center; gap: .5rem; margin-bottom: 1rem; }
.beats span { width: 18px; height: 18px; border-radius: 50%; background: var(--wash-2); }
.beats span.on { background: var(--chord); }
.field { display: grid; gap: .3rem; margin-bottom: .8rem; }
.field label { font-weight: 600; font-size: .92rem; }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: .55rem .7rem; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); }
.field textarea { font: 15px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; min-height: 12rem; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .7rem; }
pre.out { white-space: pre; overflow: auto; background: var(--wash); padding: .8rem; border-radius: 10px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height: 45vh; }

/* ---------- Editor ---------- */
.ed { max-width: 46rem; margin: 0 auto; padding: 0 1rem 6rem; }
.ed h1 { font: 700 1.5rem var(--lyric-font); margin: 1rem 0 .8rem; }
.ed .guide { background: var(--wash); border-radius: 12px; padding: .7rem .9rem; font-size: .9rem; color: var(--muted); margin-bottom: .9rem; }
.ed .guide code { font: 600 .9em ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: var(--wash-2); padding: 0 .25em; border-radius: 4px; }
.preview { border: 1.5px dashed var(--rule); border-radius: 14px; padding: .4rem .8rem 1rem; margin: .4rem 0 1rem; }
.preview-h { color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: .5rem; }

}

}

/* ---------- dibujo de la hoja: acordes anclados a la sílaba ---------- */
function anchorHTML(tok, fmt, n) {
  var ok = C.isChordTok(tok);
  return '<span class="a"><b class="ch' + (ok ? '' : ' x') + '"' +
    (ok ? ' tabindex="0" role="button" data-c="' + esc(tok) + '" data-i="' + n.i++ + '"' : '') + '>' +
    esc(ok ? fmt(tok) : tok) + '</b></span>';
}
function lyricHTML(line, fmt, n) {
  var hasCh = false, out = [], cur = null, pend = [];
  function flush() { if (cur) { out.push('<span class="w">' + cur.join('') + '</span>'); cur = null; } }
  line.segs.forEach(function (s) {
    if (s.c !== null) {
      hasCh = true;
      var a = anchorHTML(s.c, fmt, n);
      if (cur) cur.push(a); else pend.push(a);
    }
    if (!s.t) return;
    s.t.split(/(\s+)/).forEach(function (run) {
      if (!run) return;
      if (/^\s+$/.test(run)) { flush(); if (out.length) out.push(' '); return; }
      if (!cur) { cur = pend; pend = []; }
      cur.push(esc(run));
    });
  });
  if (pend.length) { cur = (cur || []).concat(pend); pend = []; }
  flush();
  while (out.length && out[out.length - 1] === ' ') out.pop();
  return '<p class="ln' + (hasCh ? ' hc' : '') + '">' + (out.join('') || '&nbsp;') + '</p>';
}
function instrHTML(line, fmt, n) {
  return '<p class="instr">' + line.segs.map(function (s) {
    var h = '';
    if (s.c !== null) {
      h = C.isChordTok(s.c)
        ? '<b class="ci" tabindex="0" role="button" data-c="' + esc(s.c) + '" data-i="' + n.i++ + '">' + esc(fmt(s.c)) + '</b>'
        : esc(s.c);
    }
    return h + esc(s.t);
  }).join('') + '</p>';
}
function bodyHTML(song, fmt) {
  var inf = info(song), h = [], n = { i: 0 }, lastGap = true;
  inf.lines.forEach(function (l) {
    if (l.type === 'blank') { if (!lastGap) h.push('<div class="gap"></div>'); lastGap = true; return; }
    lastGap = false;
    if (l.type === 'label') h.push('<h3 class="lbl">' + esc(C.sentenceCase(l.text)) + '</h3>');
    else if (l.type === 'note') h.push('<p class="note">' + esc(C.sentenceCase(l.text)) + '</p>');
    else if (l.type === 'instr') h.push(instrHTML(l, fmt, n));
    else h.push(lyricHTML(l, fmt, n));
  });
  return h.join('');
}
/* Si dos acordes vecinos se tocan, se abre el espacio justo necesario antes del segundo.
   El acorde nunca se mueve de su sílaba: solo la letra se separa un poco en ese punto.
   Si un acorde se sale por la derecha, esa línea usa menos ancho para que la palabra baje de renglón. */
function separateChords(ln) {
  var as = ln.querySelectorAll('.a'), prev = null, j;
  for (j = 0; j < as.length; j++) as[j].style.marginLeft = '';
  for (j = 0; j < as.length; j++) {
    var a = as[j], ch = a.firstChild, r = ch.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    if (prev && Math.abs(r.top - prev.top) < 4) {
      var gap = Math.max(4, r.height * 0.3);
      if (r.left < prev.right + gap) {
        // el empuje se conserva aunque la palabra baje de renglón: sus acordes siguen juntos allí
        a.style.marginLeft = (prev.right + gap - r.left).toFixed(1) + 'px';
        r = ch.getBoundingClientRect();
      }
    }
    prev = r;
  }
}
function chordOverflow(ln) {
  var R = ln.getBoundingClientRect().right, mx = -Infinity, cs = ln.querySelectorAll('.ch'), j;
  for (j = 0; j < cs.length; j++) { var r = cs[j].getBoundingClientRect(); if (r.width) mx = Math.max(mx, r.right); }
  return mx - R;
}
function fixCollisions(root) {
  if (!root) return;
  var lines = root.querySelectorAll('.ln.hc'), i;
  for (i = 0; i < lines.length; i++) { lines[i].style.paddingRight = ''; }
  for (i = 0; i < lines.length; i++) {
    var ln = lines[i];
    separateChords(ln);
    for (var tries = 0; tries < 6; tries++) {
      var o = chordOverflow(ln);
      if (o <= 0.5) break;
      ln.style.paddingRight = ((parseFloat(ln.style.paddingRight) || 0) + o * 2 + 2).toFixed(1) + 'px';
      separateChords(ln);
    }
  }
}

function snippet(plain, pos, len) {
  var a = Math.max(0, pos - 26), b = Math.min(plain.length, pos + len + 34);
  function clean(t) { return esc(t).replace(/\n+/g, ' / '); }
  return (a > 0 ? '…' : '') + clean(plain.slice(a, pos)) + '<mark>' + clean(plain.slice(pos, pos + len)) + '</mark>' + clean(plain.slice(pos + len, b)) + (b < plain.length ? '…' : '');
}
function searchSongs(songs, q) {
  var nq = C.normalize(q).replace(/\s+/g, ' ').trim(), words = nq.split(' '), res = [];
  songs.forEach(function (s) {
    var inf = info(s), t = C.normalize(s.title), a = C.normalize(s.author || ''), score = 0, sn = null, p;
    if (/^\d+$/.test(nq) && String(s.num) === nq) score = 100;
    else if (t.indexOf(nq) === 0) score = 80;
    else if (t.indexOf(nq) >= 0) score = 60;
    else if (words.every(function (w) { return t.indexOf(w) >= 0; })) score = 50;
    else if (a.indexOf(nq) >= 0) score = 30;
    else if ((p = inf.norm.indexOf(nq)) >= 0) { score = 20; sn = snippet(inf.plain, p, nq.length); }
    else if (words.length > 1 && words.every(function (w) { return inf.norm.indexOf(w) >= 0; })) score = 10;
    if (score) res.push({ s: s, score: score, sn: sn });
  });
  res.sort(function (x, y) { return y.score - x.score || ((+x.s.num || 999) - (+y.s.num || 999)); });
  return res;
}

/* ---------- piano ---------- */
var AC = null;
function audio() {

    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }

}
function playNotes(midis) {
  var ac = audio(); if (!ac) { toast('Este equipo no permite reproducir sonido aquí.'); return; }
  var t0 = ac.currentTime + 0.03;
  midis.forEach(function (m, i) {
    var t = t0 + i * 0.035, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o2.type = 'sine';

    var peak = 0.24 / Math.sqrt(midis.length);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0005, t + 1.8);
    var g2 = ac.createGain(); g2.gain.value = 0.18;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    o.start(t); o2.start(t); o.stop(t + 1.9); o2.stop(t + 1.9);
  });
}
function pianoSVG(v, names, opts) {
  opts = opts || {};
  var right = v.right, left = opts.noBass ? null : v.left, all = right.concat(left !== null ? [left] : []);
  var BLACK = { 1: 1, 3: 1, 6: 1, 8: 1, 10: 1 }, W = 30, H = 132, BW = 18, BH = 82, x = 0, whites = [], blacks = [];
  var lo = opts.lo != null ? opts.lo : Math.min.apply(null, all), hi = opts.hi != null ? opts.hi : Math.max.apply(null, all);
  while (C.mod12(lo) !== 0 && C.mod12(lo) !== 5) lo--;          // empezar en Do o Fa
  while (C.mod12(hi) !== 4 && C.mod12(hi) !== 11) hi++;         // terminar en Mi o Si
  var whitesIn = function (a, b) { var n = 0; for (var q = a; q <= b; q++) if (!BLACK[C.mod12(q)]) n++; return n; };
  while (whitesIn(lo, hi) < (opts.minWhites || 14)) { hi++; while (C.mod12(hi) !== 4 && C.mod12(hi) !== 11) hi++; }
  var fingers = v.fingers || (right.length === 3 ? [1, 3, 5] : right.length === 4 ? [1, 2, 3, 5] : right.length === 2 ? [1, 5] : [1, 2, 3, 4, 5]);

    var ri = right.indexOf(m), isL = left !== null && m === left, k = { m: m, cls: ri >= 0 ? 'rh' : (isL ? 'lh' : ''), f: ri >= 0 ? fingers[ri] : (isL ? 5 : '') };
    if (!BLACK[C.mod12(m)]) { k.x = x; whites.push(k); x += W; } else { k.x = x - BW / 2; blacks.push(k); }
  }
  var s = '<svg class="piano' + (opts.cls ? ' ' + opts.cls : '') + '" viewBox="0 0 ' + x + ' ' + (H + 2) + '" role="img" aria-label="' + esc(opts.label || 'Teclado del piano') + '">';
  whites.forEach(function (k) {
    s += '<rect class="wk' + (k.cls ? ' ' + k.cls : '') + '" x="' + (k.x + 0.5) + '" y="0.5" width="' + (W - 1) + '" height="' + H + '" rx="3"/>';
    if (k.cls) s += '<text class="lbl-w" x="' + (k.x + W / 2) + '" y="' + (H - 34) + '" style="font-size:14px">' + esc(names[k.m] || '') + '</text><text class="lbl-w" x="' + (k.x + W / 2) + '" y="' + (H - 12) + '" style="font-size:13px;opacity:.92">' + k.f + '</text>';
    else if (C.mod12(k.m) === 0) s += '<text x="' + (k.x + W / 2) + '" y="' + (H - 12) + '" fill="#8d93ad" style="font-size:12px">' + esc(C.noteName(0, 'sharp', prefs.notation)) + (k.m === 60 ? '4' : '') + '</text>';
  });
  blacks.forEach(function (k) {
    s += '<rect class="bk' + (k.cls ? ' ' + k.cls : '') + '" x="' + k.x + '" y="0.5" width="' + BW + '" height="' + BH + '" rx="2"/>';
    if (k.cls) s += '<text class="lbl-w" x="' + (k.x + BW / 2) + '" y="' + (BH - 26) + '" style="font-size:11px">' + esc(names[k.m] || '') + '</text><text class="lbl-w" x="' + (k.x + BW / 2) + '" y="' + (BH - 9) + '" style="font-size:12px">' + k.f + '</text>';
  });
  return s + '</svg>';
}
function latin(n) { return prefs.notation === 'es' && n ? C.LATIN[n[0]] + n.slice(1) : n; }
function openChordSheet(i) {
  var song = current.song; if (!song) return;
  var inf = info(song); if (!inf.seq.length) return;
  var st = { i: Math.max(0, Math.min(inf.seq.length - 1, i || 0)), v: null };
  function draw(el) {
    var tok = inf.seq[st.i], sh = songShift(song), capo = songCapo(song), spell = spellFor(inf.key, sh);
    var keep = C.mod12(sh) === 0 && prefs.spell === 'auto';
    var soundEn = C.splitTok(C.transposeTok(tok, { shift: sh, spell: spell, notation: 'en', keep: keep })).core;
    var shown = C.splitTok(fmtFor(inf.key, sh)(tok)).core, shape = C.splitTok(fmtFor(inf.key, sh - capo)(tok)).core;
    var v = C.pianoVoicing(soundEn), pc = C.parseChord(soundEn); st.v = v;

    // nombres de teclas coherentes con el acorde escrito: la fundamental y el bajo como aparecen en la hoja
    var names = {};
    v.right.forEach(function (m) { names[m] = latin(C.noteName(m, spell, 'en')); });
    names[v.right[0]] = latin(pc.rootName);

    box.innerHTML = '<div class="chordbig">' + esc(shown) + '</div>' +
      '<p class="chordnotes">Mano derecha <b>' + esc(rn) + '</b>. Mano izquierda <b>' + esc(names[v.left]) + '</b>.</p>' +
      (capo ? '<p class="chordnotes">En la guitarra, con cejilla ' + capo + ', es la forma de <b>' + esc(shape) + '</b>.</p>' : '') +
      pianoSVG(v, names) +
      '<div class="legend"><span><i style="background:#c8102e"></i>Mano derecha y sus dedos</span><span><i style="background:#3a43c4"></i>Mano izquierda (bajo)</span></div>' +
      '<p class="help" style="text-align:center">Acorde ' + (st.i + 1) + ' de ' + inf.seq.length + ' en esta canción.</p>';
  }
  var body = '<div id="chord-box"></div><div class="chordnav">' +
    '<button type="button" class="btn" data-n="-1">' + icon('back') + 'Anterior</button>' +
    '<button type="button" class="btn primary" data-n="play">' + icon('speaker') + 'Escuchar</button>' +
    '<button type="button" class="btn" data-n="1">Siguiente' + icon('fwd') + '</button></div>';
  openSheet('Acorde en el piano', body, function (el) {

      st.i = Math.max(0, Math.min(inf.seq.length - 1, st.i + (+n))); draw(el);
    });
  });
}

/* ---------- metrónomo ---------- */
var metro = { on: false, bpm: 100, beats: 4, beat: 0, next: 0, timer: 0, taps: [] };

/* ---------- desplazamiento automático y pantalla encendida ---------- */
var scroller = { on: false, raf: 0, last: 0, acc: 0 };
function scrollStep(now) {
  if (!scroller.on) return;
  var dt = Math.min(0.1, (now - scroller.last) / 1000); scroller.last = now;
  scroller.acc += (6 + prefs.speed * 5) * dt;
  var d = Math.floor(scroller.acc);
  if (d >= 1) { scroller.acc -= d; window.scrollBy(0, d); }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) { stopScroll(); return; }
  scroller.raf = requestAnimationFrame(scrollStep);
}
function startScroll() { scroller.on = true; scroller.last = performance.now(); scroller.acc = 0; scroller.raf = requestAnimationFrame(scrollStep); scrollBtn(); keepAwake(true); }
function stopScroll() { scroller.on = false; cancelAnimationFrame(scroller.raf); scrollBtn(); }
function scrollBtn() {
  var b = app.querySelector('[data-act="scroll"]'); if (!b) return;
  b.classList.toggle('on', scroller.on); b.setAttribute('aria-pressed', String(scroller.on)); b.innerHTML = icon(scroller.on ? 'pause' : 'play');
}
var wake = null;
function keepAwake(on) {
  if (!('wakeLock' in navigator)) return;
  if (on && prefs.awake && !wake) {
    navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () { /* el visor no lo permite */ });
  } else if (!on && wake) { wake.release().catch(function () {}); wake = null; }
}
function leaveSong() {
  stopScroll(); keepAwake(false);
  current.song = null; ctx.setlist = null; ctx.index = -1;
  document.body.classList.remove('has-setbar');
}

function fileName(t) { return C.normalize(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'cancion'; }

function songText(song, o) {

  var lines = inf.lines.map(function (l) { return (l.type === 'label' || l.type === 'note') ? { type: l.type, text: C.sentenceCase(l.text) } : l; });
  var body = C.songToText(lines, fmtFor(inf.key, sh - capo));

  var keyl = 'Tono: ' + keyLabel(inf.key, sh) + (capo ? ' (cejilla ' + capo + ', formas de ' + keyLabel(inf.key, sh - capo) + ')' : '');
  if (o.wa) return '*' + title + '*\n' + keyl + '\n```\n' + body + '\n```';

function copyText(text, ok) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select();
    var done = false; try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    if (done) toast(ok || 'Copiado.'); else showText('Copia este texto', text);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(ok || 'Copiado.'); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function shareText(text, title) {
  if (navigator.share) navigator.share({ title: title, text: text }).catch(function (e) { if (!e || e.name !== 'AbortError') copyText(text); });
  else copyText(text);
}

/* ---------- archivos ---------- */
/* En iPhone las descargas dentro de una app instalada fallan a menudo: allí se usa «Compartir» (guardar en Archivos, WhatsApp…). */
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.txt', { type: 'text/plain' })] })); } catch (e) { return false; }
}
function downloadFile(name, data, mime) {
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: (mime || 'text/plain') + ';charset=utf-8' }));
    a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('Descargado: ' + name, 3500);
  } catch (e) { showText('Copia el contenido y guárdalo como «' + name + '»', String(data)); }
}
function shareFile(name, data, mime) {
  var file;
  try { file = new File([data], name, { type: mime || 'text/plain' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: name }).then(function () { return true; }, function (e) {
      if (e && e.name === 'AbortError') return false;
      downloadFile(name, data, mime); return true;
    });
  }
  downloadFile(name, data, mime);
  return Promise.resolve(true);
}
function saveFile(name, data, mime) {
  if (isIOS() && canShareFiles()) return shareFile(name, data, mime);
  downloadFile(name, data, mime);
  return Promise.resolve(true);
}

/* Unir canciones y repertorios de otro archivo a la capa local del cancionero abierto. */
function mergeIntoCurrent(o) {
  var ns = 0, nl = 0;
  var takeSong = function (s) {
    if (!s || !s.id || typeof s.src !== 'string' || !s.title) return;
    s = cleanSong(s); var b = baseSong(s.id);
    if (b && JSON.stringify(cleanSong(b)) === JSON.stringify(s)) return;
    if (s.group && !GMAP[s.group]) {
      var g = (o.groups || []).filter(function (x) { return x && x.id === s.group; })[0];
      if (g) local.groups[g.id] = { id: g.id, name: String(g.name || 'Sección'), color: g.color || PALETTE[Object.keys(local.groups).length % PALETTE.length] };
      else s.group = 'nuevas';
    }
    local.songs[s.id] = s; delete local.deleted[s.id]; ns++;
  };
  var takeSet = function (sl) {
    if (!sl || !sl.id || !Array.isArray(sl.items)) return;
    local.setlists[sl.id] = { id: String(sl.id), name: String(sl.name || 'Repertorio'),
      items: sl.items.filter(function (it) { return it && it.id; }).map(function (it) { return { id: String(it.id), shift: it.shift == null ? null : +it.shift }; }) };
    delete local.setDeleted[sl.id]; nl++;
  };
  if (o.type === 'cambios') {
    Object.keys(o.groups || {}).forEach(function (id) { var g = o.groups[id]; if (g && g.id) local.groups[g.id] = { id: g.id, name: String(g.name), color: g.color }; });
    rebuildGroups();
    Object.keys(o.songs || {}).forEach(function (id) { takeSong(o.songs[id]); });
    Object.keys(o.deleted || {}).forEach(function (id) { if (baseSong(id)) { local.deleted[id] = true; delete local.songs[id]; } });
    Object.keys(o.setlists || {}).forEach(function (id) { takeSet(o.setlists[id]); });
    Object.keys(o.setDeleted || {}).forEach(function (id) { local.setDeleted[id] = true; delete local.setlists[id]; });
  } else {
    o.songs.forEach(takeSong); (o.setlists || []).forEach(takeSet);
  }
  saveLocal(); rebuildGroups(); infoCache = {};
  toast('Agregado: ' + ns + (ns === 1 ? ' canción' : ' canciones') + ' y ' + nl + (nl === 1 ? ' repertorio.' : ' repertorios.'), 4000);
  render();
}
function importPayload(text, fname) {
  var t = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!t) { toast('No hay nada que importar.'); return; }
  if (t[0] === '{') {
    var o; try { o = JSON.parse(t); } catch (e) { toast('Ese archivo no es un cancionero válido.', 4000); return; }
    if (o.type === 'cambios') { mergeIntoCurrent(o); return; }
    if (!Array.isArray(o.songs)) { toast('Ese archivo no es un cancionero válido.', 4000); return; }
    var name = String(o.name || (fname ? fname.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ') : '') || 'Cancionero importado');
    openSheet('Abrir cancionero', '<p class="help">«' + esc(name) + '» trae ' + o.songs.length + (o.songs.length === 1 ? ' canción' : ' canciones') +
      '. ¿Qué quieres hacer?</p><ul class="menu">' +
      '<li><button type="button" data-x="new">' + icon('book') + 'Abrirlo como un cancionero aparte<span class="sub">recomendado</span></button></li>' +
      '<li><button type="button" data-x="merge">' + icon('add') + 'Agregar sus canciones a «' + esc(bookTitle()) + '»</button></li></ul>', function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]'); if (!b) return;
        closeSheet(true);
        if (b.getAttribute('data-x') === 'new') createBook(name, o); else mergeIntoCurrent(o);
      });
    });
    return;
  }
  var imp = C.importText(t);
  pendingImport = { src: imp.src, title: imp.meta.title || (fname ? fname.replace(/\.[^.]+$/, '') : ''), author: imp.meta.author, key: keyFromStr(imp.meta.key) ? imp.meta.key : '' };
  if (location.hash === '#/e/nueva') render(); else location.hash = '#/e/nueva';
}
function pickFile() {
  var inp = document.createElement('input');

/* Si la app está en usuario.github.io/repositorio, se arma el enlace directo a la página de subida del repositorio. */
function githubInfo() {
  var m = /^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);
  if (!m) return null;
  var owner = m[1], seg = location.pathname.split('/').filter(Boolean);
  var repo = seg.length && !/\.(html?|json)$/i.test(seg[0]) ? seg[0] : owner + '.github.io';
  return { owner: owner, repo: repo, upload: 'https://github.com/' + owner + '/' + repo + '/upload/main', repoUrl: 'https://github.com/' + owner + '/' + repo };
}
function preparePublish() {
  // Antes de publicar se trae la última versión publicada, para no borrar lo que otra persona haya subido.
  return fetchRemote().then(function (res) {
    if (res === 'sin-red') toast('Sin internet: no pude comprobar si hay una versión más nueva. Se usa la que tienes.', 5000);
    var data = effectiveData(true);
    markPublished(data.version);
    return saveFile('canciones.json', JSON.stringify(data, null, 1), 'application/json');
  });
}

    while (base + next * period - lat < now + 0.3) { var w = base + next * period - lat; if (w > now) clickAt(w, false); next++; }
  };
  tick(); t.clickTimer = setInterval(tick, 60);
}

/* parte 5: rutas, eventos y arranque */
function parseHash() {
  var raw = location.hash, live = /\/vivo$/.test(raw);
  var r = parseHashFrom(raw.replace(/\/vivo$/, ''));
  r.live = live; r.key = raw.replace(/\/vivo$/, '');
  return r;
}
function parseHashFrom(hash) {
  var h = hash.replace(/^#\/?/, '');
  if (!h) return { name: 'home' };
  var p = h.split('/').map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (p[0] === 's' && p[1]) return { name: 'song', id: p[1] };
  if (p[0] === 'r' && !p[1]) return { name: 'sets' };
  if (p[0] === 'r' && p[1] && p[2] !== undefined && p[2] !== '') return { name: 'setsong', set: p[1], idx: +p[2] };
  if (p[0] === 'r' && p[1]) return { name: 'set', id: p[1] };
  if (p[0] === 'e' && p[1]) return { name: 'edit', id: p[1] };
  return { name: 'home' };
}
function render() {
  var r = parseHash();
  if (route.name === 'home') homeState.scroll = window.scrollY;
  if (sheetState) sheetState.onClose = null;
  closeSheet(true);
  var fromSameSong = (route.name === 'song' || route.name === 'setsong') && !route.live && route.key === r.key;
  closeLive(true);
  if (r.name !== 'edit') { editorState = null; document.body.classList.remove('ed-chords'); }
  route = r;
  if (r.name === 'home') { renderHome(); return; }
  if (r.name === 'song') { renderSong(r.id); if (r.live) openLive(fromSameSong); }
  else if (r.name === 'setsong') {
    var sl = getSetlist(r.set), it = sl && sl.items[r.idx];
    if (!it) { location.hash = sl ? '#/r/' + enc(r.set) : '#/r'; return; }
    renderSong(it.id, r.set, r.idx);
    if (r.live) openLive(fromSameSong);
  }
  else if (r.name === 'sets') renderSetlists();
  else if (r.name === 'set') renderSetlist(r.id);
  else if (r.name === 'edit') renderEditor(r.id);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

app.addEventListener('click', function (e) {
  var t = e.target;
  var ch = t.closest('.ch[data-i], .ci[data-i]');
  if (ch && route.name !== 'edit') { openChordSheet(+ch.getAttribute('data-i')); return; }
  var go = t.closest('[data-go]');
  if (go) { location.hash = go.getAttribute('data-go'); return; }
  var tab = t.closest('[data-tab]');
  if (tab) {
    homeState.group = tab.getAttribute('data-tab');
    Array.prototype.forEach.call(app.querySelectorAll('[data-tab]'), function (x) { x.setAttribute('aria-pressed', String(x === tab)); });
    var res = document.getElementById('results'); if (res) res.innerHTML = resultsHTML();
    return;
  }
  var b = t.closest('[data-act]');
  if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), ni;
  switch (act) {
    case 'back': location.hash = ctx.setlist ? '#/r/' + enc(ctx.setlist.id) : '#/'; break;
    case 'down': transpose(-1); break;
    case 'up': transpose(1); break;
    case 'key': openKeySheet(); break;
    case 'capo': openCapoSheet(); break;
    case 'view': openViewSheet(); break;
    case 'scroll': if (scroller.on) stopScroll(); else startScroll(); break;
    case 'menu': openSongMenu(); break;
    case 'addset': openAddToSet(current.song); break;
    case 'prev': case 'next':
      ni = neighbor(act === 'next' ? 1 : -1);
      if (ni >= 0) location.hash = '#/r/' + enc(ctx.setlist.id) + '/' + ni;
      break;
    case 'homemenu': openHomeMenu(); break;
    case 'help': openHelp(); break;
    case 'publish': openPublishSheet(); break;
    case 'backup': openBackupSheet(); break;
    case 'books': openBooksSheet(); break;
    case 'install': openInstall(); break;
    case 'installhide': LS.set('cfp.installHidden', true); refreshChrome(); break;
    case 'newset':
      promptSheet('Nuevo repertorio', 'Nombre', defaultSetName(), 'Crear', function (name) {
        var sl = { id: newId('r'), name: name, items: [] }; saveSetlist(sl); location.hash = '#/r/' + enc(sl.id);
      });
      break;
    case 'setmenu': openSetMenu(); break;
    case 'setadd': openSetAdd(); break;
    case 'setup': if (i > 0) mutateSet(function (sl) { var x = sl.items.splice(i, 1)[0]; sl.items.splice(i - 1, 0, x); }); break;
    case 'setdown': mutateSet(function (sl) { if (i < sl.items.length - 1) { var x = sl.items.splice(i, 1)[0]; sl.items.splice(i + 1, 0, x); } }); break;
    case 'setdel': mutateSet(function (sl) { sl.items.splice(i, 1); }); break;
    case 'edsave': saveEditor(); break;
    case 'edcancel': cancelEditor(); break;
    case 'edpaste': openPasteSheet(); break;
    case 'eddelete': deleteSong(); break;
    case 'edrestore': restoreSong(); break;
  }
});
app.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.ch[data-i], .ci[data-i]')) {
    e.preventDefault(); openChordSheet(+e.target.getAttribute('data-i'));
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sheetRoot.firstChild) { closeSheet(); return; }
  var tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || sheetRoot.firstChild || e.ctrlKey || e.metaKey || e.altKey) return;
  if (route.name === 'song' || route.name === 'setsong') {
    if (e.key === '+' || e.key === '=') { transpose(1); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { transpose(-1); e.preventDefault(); }
    else if (ctx.setlist && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      var ni = neighbor(e.key === 'ArrowRight' ? 1 : -1);
      if (ni >= 0) location.hash = '#/r/' + enc(ctx.setlist.id) + '/' + ni;
    }
  }
});
var refit = debounce(function () {
  fixCollisions(document.getElementById('song-body'));
  fixCollisions(document.getElementById('ed-prev'));
  if (liveState && !recState) drawLive();
  var eds = document.getElementById('ed-song'); if (eds && editorState && editorState.mode === 'acordes') { fixCollisions(eds); renderPanel(); }
}, 150);
window.addEventListener('resize', refit);
try {
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(refit);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refit);
  }
} catch (e) { /* sin API de fuentes */ }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && current.song) keepAwake(true); });

/* ---------- datos al día, instalación y uso sin internet ---------- */
var pendingRefresh = false;
function afterRemoteUpdate() {
  infoCache = {};
  if (route.name === 'home' || route.name === 'sets' || route.name === 'set') render();
  else pendingRefresh = true;
  var d = new Date(DATA.version);
  toast('Cancionero actualizado' + (isNaN(d) ? '.' : ': versión del ' + d.toLocaleDateString('es-PE', { day: 'numeric', month: 'long' }) + '.'), 3500);
}
window.addEventListener('hashchange', function () { pendingRefresh = false; });
window.addEventListener('online', function () { fetchRemote().then(function (res) { if (res === 'nuevo') afterRemoteUpdate(); else refreshChrome(); }); });
window.addEventListener('offline', refreshChrome);
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); install.evt = e; refreshChrome(); });
window.addEventListener('appinstalled', function () { install.evt = null; LS.set('cfp.installHidden', true); refreshChrome(); toast('Cancionero instalado.'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo sin internet */ }); });
}
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPrefs); } catch (e) { /* navegador antiguo */ }
}

openBookData();
render();
fetchRemote().then(function (res) { if (res === 'nuevo') afterRemoteUpdate(); else refreshChrome(); });
window.__cancionero = { fixCollisions: fixCollisions, listenWith: function (stream) { if (liveState) { setLiveMode('listen'); startEar(stream); } }, liveInfo: function () { return liveState ? { i: liveState.i, n: liveState.path.length, mode: liveState.mode, playing: liveState.playing, path: liveState.path.slice(), chords: liveState.vo.map(function (x) { return x.en; }), startB: liveState.startB, bpm: liveState.bpm, tl: liveState.tl } : null; }, grid: function () { return gridState ? JSON.parse(JSON.stringify(gridState.tl)) : null; }, _setV1: function (marks, end) { var st = liveState, song = clone(st.song); song.timeline = { v: 1, video: '', start: 0, sig: seqSig(st.steps), steps: marks, end: end }; local.songs[song.id] = cleanSong(song); saveLocal(); delete infoCache[song.id]; }, editorSrc: function () { return editorState ? C.modelToSrc(editorState.model) : null; }, state: function () { return { book: BOOKS.active, version: DATA.version, source: dataState.source, songs: allSongs().length, changes: localChangeCount() }; } };
})();
